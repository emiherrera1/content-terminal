name: site

# Publish both copies of the terminal by hand (after a page change, or to move the beta forward):
#   dev.content-terminal.pages.dev  this branch's code, all data
#   terminal.cvaccelerator.com      the beta branch's code, shareable data
# The daily and weekly jobs do the same after every run.
on:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: site/publish.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          FORMATS_SHEET_CSV_URL: ${{ secrets.FORMATS_SHEET_CSV_URL }}
          TERMINAL_DB: md:content_terminal
