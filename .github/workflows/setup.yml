name: setup (run by hand)

# Actions tab > "setup (run by hand)" > Run workflow, then pick a step.
#   discover: finds active mid-size channels per niche and commits config/channels_discovered.csv.
#             Uses about 5,000 of the 10,000 daily YouTube units; run it on 2 or 3 different days.
#   screen:   checks each newly discovered channel (country, recent uploads) and marks it keep, drop or
#             review in config/channels_screened.csv. About 1,200 YouTube units. Run after each discover.
#   seed:     loads the anchors plus the discovered channels marked keep. Decide the review rows first
#             (edit the verdict column in channels_screened.csv), then run this.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "discover, screen or seed"
        required: true
        type: choice
        options: [discover, screen, seed]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m terminal ${{ inputs.step }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          TERMINAL_DB: md:content_terminal
      - name: Commit the channel lists
        if: always() && (inputs.step == 'discover' || inputs.step == 'screen')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/channels_discovered.csv
          if [ -f config/channels_screened.csv ]; then git add config/channels_screened.csv; fi
          git diff --cached --quiet || git commit -m "${{ inputs.step }} run $(date -u +%Y-%m-%d)"
          git push
