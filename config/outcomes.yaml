# Outcome series the terminal's signals are tested against (6.6 lead-lag, 6.7 predictive test, 8.x call scoring).
# Google Trends: weekly US search interest. These terms are SUGGESTIONS to make the pipeline run end to end;
# replace them with the terms you would bet on for each niche. Each term becomes its own series:
#   trends:<code>:<geo>:<term>   (use that id as --outcome when logging a call)
