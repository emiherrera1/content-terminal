# Starting values for the Formula Library (Content Terminal: Formula Library, Google Drive).
# None of these are tested yet; tune them once there is data, and log every change in git.

windows:
  baseline_videos: 30        # 2.2 creator baseline: the creator's last N videos
  baseline_min: 5            # fewer comparable videos than this -> no age-adjusted score
  max_age_days: 90           # ages used for age-matched baselines
  new_creator_days: 90       # 3.13 a creator is "new" to a topic for this long after entering it
  new_creator_channel_age_days: 365   # ... and only if the channel was created within this long before entering
  new_creator_entry_gap_days: 30      # ... or it was posting other topics at least this long before entering
  seasonal_days: 56          # 3.10 weekday factors over the last 8 weeks
  z_history_days: 182        # 6.4 z-scores against the topic's own last 26 weeks
  z_min_history: 28          # fewer prior days than this -> no DSS
  gap_fill_max_days: 7       # 1.4 spread a gain over at most this many missed days
  ewma_alpha: 0.25           # 3.8 weight on the newest day in the smoothed trend
  break_window_days: 14      # 1.11 days either side of a structural break used for the splice factor

thresholds:
  breakout_outlier: 3        # 2.5 and 7.2
  breakout_topic_pct: 0.9    # 2.5 topic percentile at the same age
  min_videos: 30             # 3.20 THIN below this many videos with gains in 28 days
  min_creators: 5            # 3.20 ... or this many creators
  creator_cap: 0.10          # 4.5 max share of a topic's matched attention from one creator
  cap_min_creators: 10       # 4.5 cap applies only when the topic has at least this many matched creators
  surge_z: 3                 # 7.3
  share_shift_sd: 2          # 7.4
  dss_alert: 2               # 7.6 DSS at or above this ...
  dss_alert_days: 5          # ... for this many consecutive days
  newcomer_top: 10           # 7.5 a new creator entering the topic's top N by 7-day attention
  min_confidence: 0.7        # 10.2 a classification counts as confident at or above this
  audit_error_max: 0.15      # 10.3 audit error rate above this flags a prompt or codebook fix

breaks:                      # 1.11 dates a platform changed how it counts (Aug 24, 2026: YouTube views count from playback start)
  - 2026-08-24

index:
  base_date: null            # 4.8 null = each topic's first full day of data; set to e.g. 2026-11-02 once data starts

dss_weights:                 # 6.4
  intent_growth: 0.4
  acceleration: 0.2
  share_change: 0.2
  new_creator_share: 0.2

intent_weights:              # 6.1 by CTNCS format label; unlisted formats get `default`
  default: 0.2
  Reviews: 1.0
  Comparison: 1.0
  Unboxing: 1.0
  Haul: 1.0
  Try-On: 1.0
  First Impressions: 1.0
  Test: 1.0
  Tutorials: 0.6
  DIY: 0.6
  Recipes: 0.6
  Setup: 0.6
  Guide: 0.6

cvs:                         # 5.10-5.11 Creator Viability Score, from the Creator Watchlist Methodology
  weights:
    momentum: 25
    consistency: 20
    audience_depth: 20
    market_opportunity: 20
    hit_dependence: 15
  gates:
    min_subscribers: 25000
    min_views_28d: 250000
    max_days_since_upload: 30
  tiers:                     # score, and how many consecutive days it must hold
    watch: {score: 60, days: 1}
    priority: {score: 75, days: 14}
    diligence_ready: {score: 85, days: 28}   # also needs the manual gates (independent, clean record) confirmed
  windows:
    last_videos: 20
    upload_days: 90

later:                       # formulas that need months of history, outside data or more platforms
  decay_min_points: 7        # 2.6 fit decay only with at least this many daily gains in days 1-30
  decay_max_age: 30
  evergreen_min_age: 90      # 2.7 evergreen share for videos older than this ...
  evergreen_after_day: 30    # ... = views after this day / total views
  flow_days: 90              # 3.19 compare a creator's upload mix over the last N days with the N before
  flow_points: 0.20          # ... a shift of more than 20 points counts as moving in or out
  bootstrap_samples: 1000    # 3.21
  ci_low: 0.05
  ci_high: 0.95
  ci_max_level: 3            # bootstrap topics at sector, category and niche level
  drift_days: 90             # 5.8 last 90 days of uploads against the same window a year earlier
  lead_lag_max_weeks: 26     # 6.6
  granger_lags: 4            # 6.7 weekly lags in each model
  granger_test_share: 0.25   # ... last 25% of weeks held out
  granger_p: 0.05
  typical_move_weeks: 13     # 8.2 a hit = a move bigger than the series' typical 13-week move
  base_rate_draws: 200       # 8.5 random topics drawn per call for the base rate
  platform_z_weeks: 26       # 9.2

# 5.9 RPM bands, USD per 1,000 views. PLACEHOLDERS until replaced with published benchmarks or creator data;
# the earnings table carries rpm_source so a placeholder can never be read as a measured figure.
rpm_bands:
  source: placeholder
  default: {long_low: 2.0, long_high: 6.0, shorts_low: 0.03, shorts_high: 0.08}
  by_niche: {}

comments:                    # 6.3 purchase-intent comments cost 1 API unit per video; off until switched on
  enabled: false
  topics: []                 # CTNCS codes to sample (a watchlist), e.g. ["03.07", "03.09"]
  per_video: 100
  max_videos_per_day: 50
